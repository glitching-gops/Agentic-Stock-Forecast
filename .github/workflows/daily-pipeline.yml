name: Daily forecast pipeline

# Lever 4: runs the pipeline directly on GitHub's runner (2 cores, ~7GB RAM),
# writing straight to Supabase. Render is not involved and does none of this
# compute — it only ever serves reads plus on-demand admin-triggered
# forecasts. Render's single free-tier core running this same work is what
# OOM-killed the first production deployment.
#
# This is the DAILY (light) job: fresh data in, cheap forecast out, cached
# hyperparameters, no Optuna search. See weekly-evaluation.yml for the
# expensive purged walk-forward run.

on:
  schedule:
    # 18:30 IST = 13:00 UTC, Monday-Friday (NSE trading days).
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}

jobs:
  daily-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restores whatever the most recent run (daily OR weekly) saved.
      # Cache keys must be unique to be saved, so restore uses a prefix match
      # against the last save rather than an exact key.
      - name: Restore tuned hyperparameters cache
        uses: actions/cache/restore@v4
        with:
          path: tuned_params/
          key: tuned-params-${{ github.run_id }}
          restore-keys: |
            tuned-params-

      - name: Run daily pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -c "
          from data.db import init_db
          from data.universe import init_universe_tables
          init_db()
          init_universe_tables()
          from scheduler import run_pipeline_job
          run_pipeline_job()
          "

      # Always save, even if tune_and_cache created params for a ticker that
      # had none before — actions/cache refuses to overwrite an existing key,
      # so this always writes under a fresh (run-id-scoped) key rather than
      # trying to update the one just restored.
      - name: Save tuned hyperparameters cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tuned_params/
          key: tuned-params-${{ github.run_id }}
