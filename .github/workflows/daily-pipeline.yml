name: Trigger daily pipeline

# The pipeline used to run via an in-process APScheduler job inside the
# FastAPI process, scheduled for 18:30 IST. On Render's free tier the
# instance spins down after ~15 minutes of no inbound traffic — if it's
# asleep at 18:30, the in-process job simply never fires, with no error and
# no visible symptom other than the data quietly going stale. That's what
# happened: forecasts were 3 months old before anyone noticed.
#
# This workflow decouples the trigger from the instance's sleep state. The
# HTTP call itself wakes a sleeping instance (Render just serves it slower,
# ~50-90s, on that one request); the retries below tolerate that cold start.

on:
  schedule:
    # 18:30 IST = 13:00 UTC, Monday-Friday (NSE trading days).
    # Cron is UTC; a stray run on an NSE holiday is a harmless no-op.
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}   # manual trigger from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the full daily pipeline
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://agentic-stock-forecast.onrender.com' }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -e
          if [ -z "$ADMIN_API_KEY" ]; then
            echo "::error::ADMIN_API_KEY repository secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Triggering $API_BASE_URL/api/admin/run-daily-pipeline"

          # --retry tolerates the cold-start wake-up; --max-time is per-attempt,
          # not total, since the endpoint just backgrounds the work and returns
          # "accepted" quickly once the instance is actually awake.
          response=$(curl -sS -w "\n%{http_code}" \
            --max-time 120 \
            --retry 4 \
            --retry-delay 20 \
            --retry-all-errors \
            -X POST \
            -H "X-API-Key: ${ADMIN_API_KEY}" \
            "${API_BASE_URL}/api/admin/run-daily-pipeline")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP $http_code"
          echo "$body"

          if [ "$http_code" != "200" ]; then
            echo "::error::Pipeline trigger failed with HTTP $http_code"
            exit 1
          fi

      - name: Confirm the service is reachable
        if: always()
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://agentic-stock-forecast.onrender.com' }}
        run: |
          curl -sS --max-time 30 "${API_BASE_URL}/api/health" || \
            echo "::warning::Health check failed after triggering the pipeline"
