name: Weekly evaluation

# Lever 1 + Lever 4 combined. This is the EXPENSIVE job: purged walk-forward
# evaluation with nested Optuna tuning, run once per ticker per week instead
# of once per ticker per day. This exact workload — run daily, in-process, on
# Render's single free-tier core — is what starved the CPU for over an hour
# and then OOM-killed the instance. It now runs here instead, on GitHub's
# 2-core / ~7GB runner, writing evaluation results and conformal calibration
# straight to Supabase for the daily job (daily-pipeline.yml) to read all
# week without recomputing any of it.

on:
  schedule:
    # Saturday 08:30 IST = Saturday 03:00 UTC. Saturday rather than
    # immediately after Friday close so a multi-hour run has the whole
    # weekend as buffer before Monday's market open, and NSE is closed both
    # days so there's no daily run competing for the same database rows.
    - cron: "0 3 * * 6"
  workflow_dispatch: {}

jobs:
  weekly-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The news scorer only. CPU wheels, ~200MB, and NOT in requirements.txt —
      # that file is installed by Render and by the daily job, neither of which
      # scores anything, and torch was removed in Phase 0 as the largest
      # contributor to memory pressure on an instance already OOM-killed once.
      # `continue-on-error` because a scorer that will not install must cost a
      # recorded skip, not an hour of persisted per-ticker evaluation.
      - name: Install news-scoring extras
        continue-on-error: true
        run: pip install -r requirements-scoring.txt

      - name: Restore tuned hyperparameters cache
        uses: actions/cache/restore@v4
        with:
          path: tuned_params/
          key: tuned-params-${{ github.run_id }}
          restore-keys: |
            tuned-params-

      - name: Run weekly evaluation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -c "
          from data.db import init_db
          from data.universe import init_universe_tables
          init_db()
          init_universe_tables()
          from scheduler import run_weekly_evaluation_job
          run_weekly_evaluation_job()
          "

      - name: Save tuned hyperparameters cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tuned_params/
          key: tuned-params-${{ github.run_id }}

      # ── Evidence-Grading Redesign, Stage 0 — SHADOW ONLY ──────────────────
      #
      # A SEPARATE TRACK from the project's Phase 0-6 roadmap; neither
      # renumbers the other. This step grades the same held-out track record
      # the live gate grades, using empirical-Bayes shrinkage across the panel,
      # and writes it to `evidence_grades_v2`. It touches NOTHING the public
      # API serves: `forecast_confidence`, `forecast_current` and `forecasts`
      # are written by the step above and are not read or rewritten here.
      #
      # LAST, AND `continue-on-error`, for the same reason the baseline
      # comparison is non-fatal: it publishes nothing, so a defect in it must
      # cost a recorded skip rather than an hour of persisted per-ticker
      # evaluation. It runs after the tuned-parameter cache has been saved so
      # a slow grading run cannot cost the cache either.
      #
      # IT COSTS A SECOND FULL WALK-FORWARD (~65 min for 84 tickers), and that
      # is a known, temporary waste. `evaluate_and_persist_ticker` keeps only
      # the four scalar metrics and drops `WalkForwardResult.predictions`, so
      # there is no stored track record to bootstrap and the tool regenerates
      # it by re-running the same seeded, deterministic evaluation. Persisting
      # those predictions in the weekly job would remove this step entirely;
      # `pipeline/model.py` is out of scope for Stage 0, so it is flagged in
      # docs/stage0-evidence-grading.md instead of done here. Total budget:
      # ~56 min evaluation + ~65 min grading against a 300-minute timeout.
      - name: Shadow evidence grading (Stage 0)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python tools/run_evidence_grading.py \
            --rebuild --store --block-sweep --verify-against-persisted
