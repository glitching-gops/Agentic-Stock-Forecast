name: Series comparison (Chronos-2)

# Phase 2, the foundation-model row of the baseline table.
#
# SEPARATE FROM THE WEEKLY JOB ON PURPOSE. This needs torch, and torch is not
# in requirements.txt: it was removed in Phase 0 as the largest contributor to
# memory pressure on the free-tier Render instance that had already been
# OOM-killed once, and that file is installed by Render, by the daily pipeline
# and by the weekly evaluation — none of which call this code. Keeping the
# dependency in requirements-series.txt and the run in its own workflow is what
# stops a research comparator from reaching a production web service.
#
# It also PUBLISHES NOTHING. It reads signals, scores comparators and records
# the table into experiment_runs. That is why it can be dispatched freely and
# why a failure here cannot damage a forecast — unlike the weekly job, whose
# aborts must raise because it writes.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Cap the panel to the N widest histories (blank = all)"
        required: false
        default: ""
      models:
        description: "Which foundation models to score"
        type: choice
        required: false
        default: "both"
        options: ["both", "chronos", "timesfm"]
      context:
        description: "Trailing observations handed to the model. Cost is LINEAR in this: 46 names x 2048 ran 1.71 s/date on 2 threads, ~54 min over 1,900 dates; 512 ran 0.43 s/date."
        required: false
        default: "2048"
      folds:
        description: "Purged walk-forward folds"
        required: false
        default: "5"
      record:
        description: "Write the table into experiment_runs"
        type: boolean
        required: false
        default: true

jobs:
  series-comparison:
    runs-on: ubuntu-latest
    # The measured worst case is 95 tickers at context 2048, ~105 min for one
    # comparator; two variants plus the six linear baselines fit inside this
    # with room. A run that hits the cap is a finding, not a retry.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-series.txt

      - name: Cache the model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # ~110MB for Chronos-2-small, ~800MB for TimesFM-2.5.
          key: hf-series-models-v2

      - name: Confirm the CPU wheel was resolved
        # requirements-series.txt gets the CPU build via --extra-index-url,
        # which works only because PEP 440 sorts the local version 2.8.0+cpu
        # ABOVE plain 2.8.0. The day PyPI carries a base version the CPU index
        # has not published yet, pip silently prefers the CUDA wheel: a 2.5GB
        # download, on a runner with no GPU, for identical results. Checked
        # rather than assumed.
        run: |
          python -c "
          import torch, sys
          print('torch', torch.__version__)
          if '+cpu' not in torch.__version__:
              sys.exit(f'expected a +cpu build, resolved {torch.__version__}; '
                       f'the CPU index is behind PyPI - pin torch in '
                       f'requirements-series.txt')
          "

      - name: Fetch the checkpoints and verify their layout
        # Separate step so a Hub outage reads as a download failure rather than
        # as a model that produced nothing.
        #
        # It does more than download. check_series_model.py pins the median
        # index (Chronos puts it at 6 of 13, TimesFM at 5 of 9 — reading by
        # position rather than by value returns the 60th percentile on the
        # second one) and proves the as-of slice against the live weights,
        # which is the only thing protecting a zero-shot model from being
        # handed its own answer.
        env:
          CHRONOS_THREADS: "2"
        run: |
          python tools/check_series_model.py \
            --model "${{ github.event.inputs.models }}" \
            --context "${{ github.event.inputs.context }}"

      - name: Score every comparator
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # A GitHub-hosted runner reports more cores than it gives you, and
          # torch sizes its thread pool from that count. Left unset it
          # oversubscribes and runs slower than the two threads it actually has.
          CHRONOS_THREADS: "2"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python tools/run_baselines.py \
            ${{ contains(fromJSON('["both","chronos"]'), github.event.inputs.models) && '--chronos' || '' }} \
            ${{ contains(fromJSON('["both","timesfm"]'), github.event.inputs.models) && '--timesfm' || '' }} \
            --chronos-context "${{ github.event.inputs.context }}" \
            --timesfm-context "${{ github.event.inputs.context }}" \
            --folds "${{ github.event.inputs.folds }}" \
            ${{ github.event.inputs.tickers && format('--tickers {0}', github.event.inputs.tickers) || '' }} \
            ${{ github.event.inputs.record == 'true' && '--record' || '' }} \
            --json series-comparison.json

      - name: Upload the table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: series-comparison
          path: series-comparison.json
          if-no-files-found: warn
